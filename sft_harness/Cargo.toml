[package]
name = "sft-harness"
version = "0.1.0"
edition = "2021"

[lib]
name = "sft_harness"
path = "src/lib.rs"

[[bin]]
name = "sft-harness-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
redb = "2"

[dev-dependencies]
