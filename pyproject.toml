[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SFT-Using-MLX-For-Agentic-Tool-Calling"
version = "0.2.0"
description = "Supervised Fine-Tuning of a small LLM for agentic tool-calling with Apple MLX on Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0.0",
    "mlflow>=2.17.0",
    "hydra-core>=1.3.0",
    "numpy>=1.26.0",
    "mlx-lm>=0.22.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "omegaconf>=2.3.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[project.scripts]
train = "src.train:main"
